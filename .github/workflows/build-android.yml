name: Build Radimak TV 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Aceitar licenças e instalar SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Testar e montar APK
        working-directory: RadimakTV
        run: gradle test lintDebug assembleDebug --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Radimak-TV-2-v0.6.1
          path: RadimakTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
